name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: PHP Syntax & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: php-parallel-lint

      - name: Lint PHP Files
        run: |
          parallel-lint --exclude .git --exclude .github .

  package:
    name: Package Plugin Zip
    needs: lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Zip Package
        run: |
          mkdir -p build/whatauth-for-wordpress
          rsync -av --exclude='.git*' --exclude='build' ./ build/whatauth-for-wordpress/
          cd build
          zip -r ../whatauth-for-wordpress.zip whatauth-for-wordpress/
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: whatauth-for-wordpress.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
